name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 14 arm64
            runner: macos-14
            macos_major: "14"
            architecture: arm64
          - name: macOS 15 Intel
            runner: macos-15-intel
            macos_major: "15"
            architecture: x86_64
          - name: macOS 26 arm64
            runner: macos-26
            macos_major: "26"
            architecture: arm64
          - name: macOS 27 arm64
            runner: xcode-27
            macos_major: "27"
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.runner == 'macos-15-intel' && 45 || 30 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify supported macOS host
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_MACOS_MAJOR: ${{ matrix.macos_major }}
        run: |
          test "$(sw_vers -productVersion | cut -d. -f1)" = "$EXPECTED_MACOS_MAJOR"
          test "$(uname -m)" = "$EXPECTED_ARCHITECTURE"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146

      - name: Install cargo-shear
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-shear

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check unused dependencies
        run: cargo shear

      - name: Enforce privileged-helper sudo boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo_references=$(git grep -n -F '"/usr/bin/sudo"' -- 'crates/**/*.rs')
          printf '%s\n' "$sudo_references"
          reference_count=$(printf '%s\n' "$sudo_references" | wc -l | tr -d '[:space:]')
          test "$reference_count" = 1
          case "$sudo_references" in
            crates/platform/src/helper.rs:*) ;;
            *) exit 1 ;;
          esac

      - name: Check artifact recipe scripts
        run: shellcheck release/artifacts/recipes/common.sh release/artifacts/recipes/php/*.sh release/artifacts/recipes/composer/*.sh release/artifacts/recipes/redis/*.sh release/artifacts/recipes/mysql/*.sh release/artifacts/recipes/postgres/*.sh release/artifacts/recipes/mailpit/*.sh release/artifacts/recipes/rustfs/*.sh

      - name: Enable nextest run recording
        run: |
          cat > "$RUNNER_TEMP/nextest-user.toml" <<'EOF'
          [experimental]
          record = true

          [record]
          enabled = true
          EOF

      - name: Check root low-port conflicts against a separate process
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --all-features -p daemon --example pv-fake
          cargo nextest list --locked --all-features -p platform --lib --run-ignored only \
            -E 'test(=helper::tests::pf_apply_rejects_a_low_port_conflict_as_root)' \
            --message-format json > "$RUNNER_TEMP/low-port-tests.json"
          test_binary=$(python3 - "$RUNNER_TEMP/low-port-tests.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1]) as source:
              tests = json.load(source)
          suite = tests["rust-suites"]["platform"]
          selected = [name for name, case in suite["testcases"].items()
                      if case["filter-match"]["status"] == "matches"]
          assert selected == ["helper::tests::pf_apply_rejects_a_low_port_conflict_as_root"], selected
          assert suite["testcases"][selected[0]]["ignored"]
          print(suite["binary-path"])
          PY
          )
          sudo -n "$test_binary" --ignored --exact helper::tests::pf_apply_rejects_a_low_port_conflict_as_root

      - name: Run tests
        id: tests
        run: cargo nextest run --profile ci --user-config-file "$RUNNER_TEMP/nextest-user.toml" --workspace --all-features --locked

      - name: Export test recording
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: cargo nextest store export latest --archive-file "$RUNNER_TEMP/nextest-run.zip"

      - name: Upload test recording
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-run-${{ matrix.runner }}
          path: ${{ runner.temp }}/nextest-run.zip

  linux:
    name: Linux (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.runner }}

      - name: Install development tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-shear,shellcheck@0.11.0

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy including Linux implementations
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Check unused dependencies
        run: cargo shear

      - name: Enforce privileged-helper sudo boundary
        shell: bash
        run: |
          set -euo pipefail
          sudo_references=$(git grep -n -F '"/usr/bin/sudo"' -- 'crates/**/*.rs')
          printf '%s\n' "$sudo_references"
          reference_count=$(printf '%s\n' "$sudo_references" | wc -l | tr -d '[:space:]')
          test "$reference_count" = 1
          case "$sudo_references" in
            crates/platform/src/helper.rs:*) ;;
            *) exit 1 ;;
          esac

      - name: Check shell scripts and container helper
        run: |
          shellcheck scripts/linux/*.sh release/artifacts/recipes/common.sh release/artifacts/recipes/*/*.sh
          python3 scripts/linux/test_container.py

      - name: Run Linux workspace tests
        id: tests
        run: |
          cat > "$RUNNER_TEMP/nextest-user.toml" <<'EOF'
          [experimental]
          record = true

          [record]
          enabled = true
          EOF
          cargo nextest run --profile ci --user-config-file "$RUNNER_TEMP/nextest-user.toml" --workspace --all-features --locked

      - name: Export test recording
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: cargo nextest store export latest --archive-file "$RUNNER_TEMP/nextest-run.zip"

      - name: Upload test recording
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-run-${{ matrix.runner }}
          path: ${{ runner.temp }}/nextest-run.zip

      - name: Prepare native Linux daemon registration test
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --all-features -p pv -p daemon --examples --bins
          runner_account=$(id -un)
          runner_uid=$(id -u)
          sudo -n loginctl enable-linger "$runner_account"
          sudo -n systemctl start "user@${runner_uid}.service"
          nextest_state_directory=$(mktemp -d "$RUNNER_TEMP/nextest-system-state.XXXXXX")
          {
            printf 'XDG_RUNTIME_DIR=/run/user/%s\n' "$runner_uid"
            printf 'DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/%s/bus\n' "$runner_uid"
            printf 'NEXTEST_STATE_DIR=%s\n' "$nextest_state_directory"
          } >> "$GITHUB_ENV"

      - name: Run native Linux daemon registration test
        id: linux_system_tests
        env:
          PV_LINUX_SYSTEM_TESTS: "1"
          PV_LINUX_SYSTEM_PV: ${{ github.workspace }}/target/debug/pv
        run: |
          cargo nextest run --profile ci --user-config-file "$RUNNER_TEMP/nextest-user.toml" \
            --run-ignored only -p cli -p daemon --all-features --locked \
            -E 'binary(=linux_daemon_registration_system)'

      - name: Export Linux system test recording
        if: ${{ !cancelled() && steps.linux_system_tests.outcome != 'skipped' }}
        run: cargo nextest store export latest --archive-file "$RUNNER_TEMP/nextest-system-run.zip"

      - name: Upload Linux system test recording
        if: ${{ !cancelled() && steps.linux_system_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-system-run-${{ matrix.runner }}
          path: ${{ runner.temp }}/nextest-system-run.zip

      - name: Prepare native Linux helper and DNS tests
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --all-features -p pv-privileged-helper
          cargo nextest list --locked --all-features -p cli --run-ignored only \
            -E 'binary(=linux_helper_system) and (test(=systemd_helper_lifecycle_authenticates_replaces_rolls_back_and_removes) or test(/^dns_system::/))'
          mkdir "$RUNNER_TEMP/nextest-helper-recordings"

      - name: Run native Linux helper and DNS tests
        id: linux_helper_tests
        shell: bash
        run: |
          set -euo pipefail
          sudo -n ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          for test_case in \
            systemd_helper_lifecycle_authenticates_replaces_rolls_back_and_removes \
            dns_system::systemd_dns_routes_test_reapplies_after_restart_changes_port_and_refuses_conflicts
          do
            NEXTEST_STATE_DIR=$(mktemp -d "$RUNNER_TEMP/nextest-helper-state.XXXXXX")
            export NEXTEST_STATE_DIR
            test_status=0
            sudo -n systemd-run --wait --pipe --collect --unit=pv-helper-system-test \
              --uid="$(id -u)" --property=KillMode=control-group \
              --property=RuntimeMaxSec=120s --property=TimeoutStopSec=5s \
              --working-directory="$PWD" --setenv="HOME=$HOME" --setenv="PATH=$PATH" \
              --setenv="CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
              --setenv="RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" \
              --setenv="CARGO_BUILD_JOBS=$CARGO_BUILD_JOBS" \
              --setenv="CARGO_PROFILE_DEV_DEBUG=$CARGO_PROFILE_DEV_DEBUG" \
              --setenv="CARGO_INCREMENTAL=$CARGO_INCREMENTAL" \
              --setenv="NEXTEST_STATE_DIR=$NEXTEST_STATE_DIR" --setenv=INSTA_UPDATE=no \
              --setenv=PV_LINUX_SYSTEM_TESTS=1 \
              --setenv="PV_LINUX_SYSTEM_HELPER=$PWD/target/debug/pv-helper" \
              "$(command -v cargo)" nextest run --profile ci \
              --user-config-file "$RUNNER_TEMP/nextest-user.toml" \
              --run-ignored only -p cli --all-features --locked \
              -E "binary(=linux_helper_system) and test(=$test_case)" || test_status=$?
            recording_status=0
            cargo nextest store export latest \
              --archive-file "$RUNNER_TEMP/nextest-helper-recordings/${test_case##*::}.zip" \
              || recording_status=$?
            if ((test_status != 0)); then
              exit "$test_status"
            fi
            test "$recording_status" -eq 0
          done

      - name: Upload Linux helper test recording
        if: ${{ !cancelled() && steps.linux_helper_tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: nextest-helper-run-${{ matrix.runner }}
          path: ${{ runner.temp }}/nextest-helper-recordings/*.zip
          if-no-files-found: error

  runtime-portability:
    name: Runtime (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux
          - runner: windows-latest
            target: windows
    runs-on: ${{ matrix.runner }}
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Compile installed runtime
        run: >-
          cargo check --locked
          -p pv -p cli -p config -p daemon -p platform
          -p protocol -p pv-privileged-helper -p resources -p self-update -p state

      - name: Build PV
        run: cargo build --locked -p pv

      - name: Test portable domain boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p state -p config -p resources -p platform --lib unsupported
          cargo test --locked -p state --lib update_lock
          cargo test --locked -p resources --lib target_platform_for
          cargo test --locked -p platform --test unsupported_launch_agent
          cargo test --locked -p daemon --test platform_preflight

      - name: Compile daemon tests on Linux
        if: matrix.target == 'linux'
        run: cargo test --locked -p daemon --all-features --tests --no-run

      - name: Test portable runtime health on Linux
        if: matrix.target == 'linux'
        run: |
          cargo build --locked -p daemon --all-features --examples
          cargo test --locked -p daemon --all-features --lib health::tests

      - name: Smoke portable commands
        shell: bash
        run: |
          set -euo pipefail
          pv_binary=target/debug/pv
          if [[ -x target/debug/pv.exe ]]; then
            pv_binary=target/debug/pv.exe
          fi
          pv_smoke_home=$(mktemp -d)
          export HOME="$pv_smoke_home"
          export USERPROFILE="$pv_smoke_home"
          "$pv_binary" --help >/dev/null
          "$pv_binary" --version >/dev/null
          "$pv_binary" completions bash >/dev/null
          test ! -e "$pv_smoke_home/.pv"

      - name: Smoke unsupported host capability
        if: matrix.target == 'windows'
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          pv_binary=target/debug/pv
          if [[ -x target/debug/pv.exe ]]; then
            pv_binary=target/debug/pv.exe
          fi
          pv_smoke_home=$(mktemp -d)
          export HOME="$pv_smoke_home"
          export USERPROFILE="$pv_smoke_home"
          if output=$("$pv_binary" daemon:enable 2>&1); then
            printf '%s\n' "daemon:enable unexpectedly succeeded" >&2
            exit 1
          fi
          printf '%s\n' "$output" | grep -F \
            "daemon registration is unsupported on ${EXPECTED_TARGET}"
          test ! -e "$pv_smoke_home/.pv"
