name: Artifact Recipes

on:
  workflow_dispatch:
    inputs:
      resource:
        description: "Resource to build: all, php, composer, redis, mysql, postgres, mailpit, rustfs, caddy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - php
          - composer
          - redis
          - mysql
          - postgres
          - mailpit
          - rustfs
          - caddy
      track:
        description: "Track to build: all; PHP 8.3/8.4/8.5; MySQL 8.0/8.4/9.7; Postgres 17/18; Redis 8.8; Composer 2; Mailpit 1; RustFS 1; Caddy 2"
        required: true
        default: "all"
        type: string
      platform:
        description: "Artifact platform: all uses darwin-arm64 for native recipes, adds darwin-amd64 for Postgres and Caddy, and uses any for Composer; choose darwin-arm64 or darwin-amd64 explicitly for one platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - darwin-arm64
          - darwin-amd64

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate selected inputs
        env:
          PV_RECIPE_RESOURCE: ${{ inputs.resource }}
          PV_RECIPE_TRACK: ${{ inputs.track }}
          PV_RECIPE_PLATFORM: ${{ inputs.platform }}
        run: |
          set -eu

          case "$PV_RECIPE_PLATFORM" in
            all | darwin-arm64 | darwin-amd64) ;;
            *) printf '%s\n' "unsupported platform: $PV_RECIPE_PLATFORM" >&2; exit 1 ;;
          esac

          case "$PV_RECIPE_RESOURCE:$PV_RECIPE_TRACK" in
            all:all) ;;
            php:all | php:8.3 | php:8.4 | php:8.5) ;;
            composer:all | composer:2) ;;
            redis:all | redis:8.8) ;;
            mysql:all | mysql:8.0 | mysql:8.4 | mysql:9.7) ;;
            postgres:all | postgres:17 | postgres:18) ;;
            mailpit:all | mailpit:1) ;;
            rustfs:all | rustfs:1) ;;
            caddy:all | caddy:2) ;;
            *)
              printf '%s\n' "unsupported resource/track combination: $PV_RECIPE_RESOURCE/$PV_RECIPE_TRACK" >&2
              exit 1
              ;;
          esac

      - name: Validate recipe metadata
        run: |
          set -eu
          fixtures_dir=/tmp/pv-recipe-fixtures
          rm -rf "$fixtures_dir"
          cargo run -p pv-release -- generate-recipe-fixtures \
            --php release/artifacts/recipes/php/tracks.toml \
            --composer release/artifacts/recipes/composer/composer.toml \
            --redis release/artifacts/recipes/redis/recipe.toml \
            --mysql release/artifacts/recipes/mysql/recipe.toml \
            --postgres release/artifacts/recipes/postgres/recipe.toml \
            --mailpit release/artifacts/recipes/mailpit/recipe.toml \
            --caddy release/artifacts/recipes/caddy/recipe.toml \
            --rustfs release/artifacts/recipes/rustfs/recipe.toml \
            --archives "$fixtures_dir/archives" \
            --records "$fixtures_dir/records" \
            --pv-commit "$(git rev-parse HEAD)" \
            --build-run-id "${{ github.run_id }}"
          cargo run -p pv-release -- generate-manifest \
            --records "$fixtures_dir/records" \
            --revocations release/artifacts/revocations \
            --defaults release/artifacts/default-tracks.toml \
            --output "$fixtures_dir/manifest.json" \
            --base-url https://artifacts.example.test

  build-php:
    name: "php & frankenphp ${{ matrix.track }} ${{ matrix.platform }}"
    needs: validate
    if: ${{ inputs.resource == 'all' || inputs.resource == 'php' }}
    runs-on: ${{ matrix.platform == 'darwin-amd64' && 'macos-15-intel' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        # StaticPHP v3 currently fails the FrankenPHP macOS Intel link step, and
        # explicit darwin-amd64 dispatch remains available only for diagnostics
        # until upstream v3 is fixed.
        track: ${{ fromJSON(inputs.track == 'all' && '["8.3","8.4","8.5"]' || format('["{0}"]', inputs.track)) }}
        platform: ${{ fromJSON(inputs.platform == 'all' && '["darwin-arm64"]' || format('["{0}"]', inputs.platform)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install PHP runtime dependency
        run: |
          set -eu
          brew update
          brew install php pkgconf

      - name: Install StaticPHP CLI
        run: |
          set -eu
          runner_architecture=$(uname -m)
          case "$runner_architecture" in
            arm64) static_php_architecture=aarch64 ;;
            x86_64) static_php_architecture=x86_64 ;;
            *)
              printf '%s\n' "unsupported StaticPHP CLI architecture: $runner_architecture" >&2
              exit 1
              ;;
          esac

          mkdir -p "${RUNNER_TEMP:?}/pv-tools"
          curl -L --fail --show-error --silent \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "https://dl.static-php.dev/v3/spc-bin/nightly/spc-macos-$static_php_architecture" \
            -o "$RUNNER_TEMP/pv-tools/spc"
          chmod +x "$RUNNER_TEMP/pv-tools/spc"
          "$RUNNER_TEMP/pv-tools/spc" --version
          "$RUNNER_TEMP/pv-tools/spc" build:php --help | grep -- '--build-frankenphp' >/dev/null
          "$RUNNER_TEMP/pv-tools/spc" build:php --help | grep -- '--dl-custom-local' >/dev/null
          printf '%s\n' "$RUNNER_TEMP/pv-tools" >>"${GITHUB_PATH:?}"

      - name: Build PHP and FrankenPHP artifacts
        env:
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_COMMIT: ${{ github.sha }}
          PV_BUILD_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu

          rm -rf "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"
          mkdir -p "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"

          release/artifacts/recipes/php/build.sh

          # StaticPHP's Go module cache can leave read-only files under work/.
          # Restore user write permission before pruning non-uploaded build scratch.
          if [ -d "$PV_ARTIFACT_OUT_DIR/work" ]; then
            chmod -R u+w "$PV_ARTIFACT_OUT_DIR/work"
          fi
          rm -rf "$PV_ARTIFACT_OUT_DIR/sources" "$PV_ARTIFACT_OUT_DIR/work"

      - name: Upload StaticPHP failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-staticphp-logs-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pv-artifacts/work/**/staticphp/log/*.log
          if-no-files-found: ignore

      - name: Generate manifest from records
        env:
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_MANIFEST_DEFAULTS: ${{ runner.temp }}/pv-default-tracks.toml
        run: |
          set -eu

          cat >"$PV_MANIFEST_DEFAULTS" <<DEFAULT_TRACKS
          [[resource]]
          name = "php"
          default_track = "$PV_RECIPE_TRACK"

          [[resource]]
          name = "frankenphp"
          default_track = "$PV_RECIPE_TRACK"

          DEFAULT_TRACKS

          cargo run -p pv-release -- generate-manifest \
            --records "$PV_ARTIFACT_RECORD_DIR" \
            --revocations release/artifacts/revocations \
            --defaults "$PV_MANIFEST_DEFAULTS" \
            --output "$PV_ARTIFACT_OUT_DIR/manifest.json" \
            --base-url https://artifacts.example.test

      - name: Upload artifact archives and records
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-php-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-artifacts/*.tar.gz
            ${{ runner.temp }}/pv-artifacts/manifest.json
            ${{ runner.temp }}/pv-records/**/*.json
          if-no-files-found: error

  build-caddy:
    name: "caddy ${{ matrix.track }} ${{ matrix.platform }}"
    needs: validate
    if: ${{ inputs.resource == 'all' || inputs.resource == 'caddy' }}
    runs-on: ${{ matrix.platform == 'darwin-amd64' && 'macos-15-intel' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(inputs.track == 'all' && '["2"]' || format('["{0}"]', inputs.track)) }}
        # Caddy is a native downloaded binary, so its all-platform source run
        # includes both native identities for one publication gate.
        platform: ${{ fromJSON(inputs.platform == 'all' && '["darwin-arm64","darwin-amd64"]' || format('["{0}"]', inputs.platform)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Caddy artifact
        env:
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_COMMIT: ${{ github.sha }}
          PV_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu

          rm -rf "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"
          mkdir -p "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"

          release/artifacts/recipes/caddy/build.sh

          rm -rf "$PV_ARTIFACT_OUT_DIR/sources" "$PV_ARTIFACT_OUT_DIR/work"

      - name: Generate manifest from records
        env:
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_MANIFEST_DEFAULTS: ${{ runner.temp }}/pv-default-tracks.toml
        run: |
          set -eu

          cat >"$PV_MANIFEST_DEFAULTS" <<DEFAULT_TRACKS
          [[resource]]
          name = "caddy"
          default_track = "${{ matrix.track }}"

          DEFAULT_TRACKS

          cargo run -p pv-release -- generate-manifest \
            --records "$PV_ARTIFACT_RECORD_DIR" \
            --revocations release/artifacts/revocations \
            --defaults "$PV_MANIFEST_DEFAULTS" \
            --output "$PV_ARTIFACT_OUT_DIR/manifest.json" \
            --base-url https://artifacts.example.test

      - name: Upload artifact archives and records
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-caddy-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-artifacts/*.tar.gz
            ${{ runner.temp }}/pv-artifacts/manifest.json
            ${{ runner.temp }}/pv-records/**/*.json
          if-no-files-found: error

  build-composer:
    name: "composer ${{ matrix.track }} ${{ matrix.platform }}"
    needs: validate
    if: ${{ inputs.resource == 'all' || inputs.resource == 'composer' }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(inputs.track == 'all' && '["2"]' || format('["{0}"]', inputs.track)) }}
        platform: [any]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install PHP runtime dependency
        run: |
          set -eu
          brew update
          brew install php

      - name: Build Composer artifact
        env:
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_COMMIT: ${{ github.sha }}
          PV_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu

          rm -rf "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"
          mkdir -p "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"

          PV_COMPOSER_SMOKE_PHP="$(command -v php)" \
            release/artifacts/recipes/composer/build.sh

          rm -rf "$PV_ARTIFACT_OUT_DIR/sources" "$PV_ARTIFACT_OUT_DIR/work"

      - name: Generate manifest from records
        env:
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_MANIFEST_DEFAULTS: ${{ runner.temp }}/pv-default-tracks.toml
        run: |
          set -eu

          cat >"$PV_MANIFEST_DEFAULTS" <<DEFAULT_TRACKS
          [[resource]]
          name = "composer"
          default_track = "${{ matrix.track }}"

          DEFAULT_TRACKS

          cargo run -p pv-release -- generate-manifest \
            --records "$PV_ARTIFACT_RECORD_DIR" \
            --revocations release/artifacts/revocations \
            --defaults "$PV_MANIFEST_DEFAULTS" \
            --output "$PV_ARTIFACT_OUT_DIR/manifest.json" \
            --base-url https://artifacts.example.test

      - name: Upload artifact archives and records
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-composer-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-artifacts/*.tar.gz
            ${{ runner.temp }}/pv-artifacts/manifest.json
            ${{ runner.temp }}/pv-records/**/*.json
          if-no-files-found: error

  build-redis:
    name: "redis ${{ matrix.track }} ${{ matrix.platform }}"
    needs: validate
    if: ${{ inputs.resource == 'all' || inputs.resource == 'redis' }}
    runs-on: ${{ matrix.platform == 'darwin-amd64' && 'macos-15-intel' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(inputs.track == 'all' && '["8.8"]' || format('["{0}"]', inputs.track)) }}
        platform: ${{ fromJSON(inputs.platform == 'all' && '["darwin-arm64"]' || format('["{0}"]', inputs.platform)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Redis artifact
        env:
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_COMMIT: ${{ github.sha }}
          PV_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu

          rm -rf "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"
          mkdir -p "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"

          release/artifacts/recipes/redis/build.sh

          rm -rf "$PV_ARTIFACT_OUT_DIR/sources" "$PV_ARTIFACT_OUT_DIR/work"

      - name: Generate manifest from records
        env:
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_MANIFEST_DEFAULTS: ${{ runner.temp }}/pv-default-tracks.toml
        run: |
          set -eu

          cat >"$PV_MANIFEST_DEFAULTS" <<DEFAULT_TRACKS
          [[resource]]
          name = "redis"
          default_track = "${{ matrix.track }}"

          DEFAULT_TRACKS

          cargo run -p pv-release -- generate-manifest \
            --records "$PV_ARTIFACT_RECORD_DIR" \
            --revocations release/artifacts/revocations \
            --defaults "$PV_MANIFEST_DEFAULTS" \
            --output "$PV_ARTIFACT_OUT_DIR/manifest.json" \
            --base-url https://artifacts.example.test

      - name: Upload artifact archives and records
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-redis-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-artifacts/*.tar.gz
            ${{ runner.temp }}/pv-artifacts/manifest.json
            ${{ runner.temp }}/pv-records/**/*.json
          if-no-files-found: error

  build-mysql:
    name: "mysql ${{ matrix.track }} ${{ matrix.platform }}"
    needs: validate
    if: ${{ inputs.resource == 'all' || inputs.resource == 'mysql' }}
    runs-on: ${{ matrix.platform == 'darwin-amd64' && 'macos-15-intel' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(inputs.track == 'all' && '["8.0","8.4","9.7"]' || format('["{0}"]', inputs.track)) }}
        platform: ${{ fromJSON(inputs.platform == 'all' && '["darwin-arm64"]' || format('["{0}"]', inputs.platform)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build MySQL artifact
        env:
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_COMMIT: ${{ github.sha }}
          PV_BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          set -eu

          rm -rf "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"
          mkdir -p "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"

          release/artifacts/recipes/mysql/build.sh

          rm -rf "$PV_ARTIFACT_OUT_DIR/sources" "$PV_ARTIFACT_OUT_DIR/work"

      - name: Generate manifest from records
        env:
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_MANIFEST_DEFAULTS: ${{ runner.temp }}/pv-default-tracks.toml
        run: |
          set -eu

          cat >"$PV_MANIFEST_DEFAULTS" <<DEFAULT_TRACKS
          [[resource]]
          name = "mysql"
          default_track = "${{ matrix.track }}"

          DEFAULT_TRACKS

          cargo run -p pv-release -- generate-manifest \
            --records "$PV_ARTIFACT_RECORD_DIR" \
            --revocations release/artifacts/revocations \
            --defaults "$PV_MANIFEST_DEFAULTS" \
            --output "$PV_ARTIFACT_OUT_DIR/manifest.json" \
            --base-url https://artifacts.example.test

      - name: Upload artifact archives and records
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-mysql-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-artifacts/*.tar.gz
            ${{ runner.temp }}/pv-artifacts/manifest.json
            ${{ runner.temp }}/pv-records/**/*.json
          if-no-files-found: error

  build-postgres-dependencies:
    name: "postgres dependencies ${{ matrix.platform }}"
    needs: validate
    if: ${{ inputs.resource == 'all' || inputs.resource == 'postgres' }}
    runs-on: ${{ matrix.platform == 'darwin-amd64' && 'macos-15-intel' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform == 'all' && '["darwin-arm64","darwin-amd64"]' || format('["{0}"]', inputs.platform)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve reusable dependency inputs
        id: dependency-inputs
        env:
          PV_BUILD_JOBS: 2
          PV_POSTGRES_DEPENDENCY_WORK_DIR: ${{ runner.temp }}/pv-postgres-dependencies
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu

          release/artifacts/recipes/postgres/dependencies.sh describe >>"${GITHUB_OUTPUT:?}"

      - name: Restore reusable OpenSSL bundle
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pv-postgres-dependencies/openssl.tar.gz
          key: ${{ steps.dependency-inputs.outputs.cache_key }}

      - name: Restore checksum-keyed OpenSSL source
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pv-postgres-source-cache/${{ steps.dependency-inputs.outputs.source_archive_name }}
          key: postgres-source-${{ steps.dependency-inputs.outputs.source_sha256 }}

      - name: Build and validate reusable OpenSSL bundle
        env:
          PV_BUILD_JOBS: 2
          PV_POSTGRES_DEPENDENCY_BUNDLE: ${{ runner.temp }}/pv-postgres-dependencies/openssl.tar.gz
          PV_POSTGRES_DEPENDENCY_CACHE_HIT: ${{ steps.dependency-cache.outputs.cache-hit }}
          PV_POSTGRES_DEPENDENCY_PREFIX: ${{ runner.temp }}/pv-postgres-dependency-prefix/openssl
          PV_POSTGRES_DEPENDENCY_WORK_DIR: ${{ runner.temp }}/pv-postgres-dependency-work
          PV_POSTGRES_SOURCE_CACHE_DIR: ${{ runner.temp }}/pv-postgres-source-cache
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu

          started_at=$(date +%s)
          cache_hit=${PV_POSTGRES_DEPENDENCY_CACHE_HIT:-false}
          if [ "$cache_hit" != true ]; then
            release/artifacts/recipes/postgres/dependencies.sh build \
              "$PV_POSTGRES_DEPENDENCY_BUNDLE" \
              "$PV_POSTGRES_DEPENDENCY_PREFIX"
          fi
          release/artifacts/recipes/postgres/dependencies.sh use \
            "$PV_POSTGRES_DEPENDENCY_BUNDLE" \
            "$PV_POSTGRES_DEPENDENCY_PREFIX"
          finished_at=$(date +%s)
          duration_seconds=$((finished_at - started_at))
          archive_size_bytes=$(stat -f '%z' "$PV_POSTGRES_DEPENDENCY_BUNDLE")
          {
            printf '### PostgreSQL reusable dependency (%s)\n\n' "$PV_RECIPE_PLATFORM"
            printf '%s\n' "- Cache hit: $cache_hit"
            printf '%s\n' "- Archive size: $archive_size_bytes bytes"
            printf '%s\n' "- Wall-clock duration: $duration_seconds seconds"
          } >>"${GITHUB_STEP_SUMMARY:?}"

      - name: Hand off validated OpenSSL bundle
        uses: actions/upload-artifact@v7
        with:
          name: pv-postgres-openssl-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-postgres-dependencies/openssl.tar.gz
            ${{ runner.temp }}/pv-postgres-dependencies/openssl-contract.txt
          if-no-files-found: error
          overwrite: true

  build-postgres:
    name: "postgres ${{ matrix.track }} ${{ matrix.platform }}"
    needs: [validate, build-postgres-dependencies]
    if: ${{ inputs.resource == 'all' || inputs.resource == 'postgres' }}
    runs-on: ${{ matrix.platform == 'darwin-amd64' && 'macos-15-intel' || 'macos-14' }}
    strategy:
      fail-fast: false
      matrix:
        track: ${{ fromJSON(inputs.track == 'all' && '["17","18"]' || format('["{0}"]', inputs.track)) }}
        platform: ${{ fromJSON(inputs.platform == 'all' && '["darwin-arm64","darwin-amd64"]' || format('["{0}"]', inputs.platform)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download validated OpenSSL bundle
        uses: actions/download-artifact@v8
        with:
          name: pv-postgres-openssl-${{ matrix.platform }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pv-postgres-dependencies

      - name: Resolve PostgreSQL source input
        id: postgres-source
        env:
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_RECIPE_TRACK: ${{ matrix.track }}
        run: |
          set -eu

          env_file="${RUNNER_TEMP:?}/postgres-source.env"
          cargo run -p pv-release -- print-recipe-env \
            --postgres release/artifacts/recipes/postgres/recipe.toml \
            --resource postgres \
            --track "$PV_RECIPE_TRACK" \
            --platform "$PV_RECIPE_PLATFORM" >"$env_file"
          # shellcheck source=/dev/null
          . "$env_file"
          {
            printf '%s\n' "source_archive_name=postgresql-$PV_UPSTREAM_VERSION.tar.gz"
            printf '%s\n' "source_sha256=$PV_SOURCE_SHA256"
          } >>"${GITHUB_OUTPUT:?}"

      - name: Restore checksum-keyed PostgreSQL source
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/pv-postgres-source-cache/${{ steps.postgres-source.outputs.source_archive_name }}
          key: postgres-source-${{ steps.postgres-source.outputs.source_sha256 }}

      - name: Build Postgres artifact
        env:
          PV_BUILD_JOBS: 2
          PV_RECIPE_TRACK: ${{ matrix.track }}
          PV_RECIPE_PLATFORM: ${{ matrix.platform }}
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_COMMIT: ${{ github.sha }}
          PV_BUILD_RUN_ID: ${{ github.run_id }}
          PV_POSTGRES_OPENSSL_BUNDLE_ARCHIVE: ${{ runner.temp }}/pv-postgres-dependencies/openssl.tar.gz
          PV_POSTGRES_OPENSSL_CONTRACT_FILE: ${{ runner.temp }}/pv-postgres-dependencies/openssl-contract.txt
          PV_POSTGRES_SOURCE_CACHE_DIR: ${{ runner.temp }}/pv-postgres-source-cache
        run: |
          set -eu

          started_at=$(date +%s)
          rm -rf "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"
          mkdir -p "$PV_ARTIFACT_OUT_DIR" "$PV_ARTIFACT_RECORD_DIR"

          release/artifacts/recipes/postgres/build.sh

          archive_count=0
          archive=
          for candidate in "$PV_ARTIFACT_OUT_DIR"/postgres-*.tar.gz; do
            [ -f "$candidate" ] || continue
            archive_count=$((archive_count + 1))
            archive=$candidate
          done
          [ "$archive_count" -eq 1 ] || {
            printf '%s\n' "expected exactly one PostgreSQL archive, found $archive_count" >&2
            exit 1
          }
          finished_at=$(date +%s)
          duration_seconds=$((finished_at - started_at))
          archive_size_bytes=$(stat -f '%z' "$archive")
          {
            printf '### PostgreSQL %s %s\n\n' "$PV_RECIPE_TRACK" "$PV_RECIPE_PLATFORM"
            printf '%s\n' "- Archive size: $archive_size_bytes bytes"
            printf '%s\n' "- Wall-clock duration: $duration_seconds seconds"
          } >>"${GITHUB_STEP_SUMMARY:?}"

          rm -rf "$PV_ARTIFACT_OUT_DIR/sources" "$PV_ARTIFACT_OUT_DIR/work"

      - name: Generate manifest from records
        env:
          PV_ARTIFACT_RECORD_DIR: ${{ runner.temp }}/pv-records
          PV_ARTIFACT_OUT_DIR: ${{ runner.temp }}/pv-artifacts
          PV_MANIFEST_DEFAULTS: ${{ runner.temp }}/pv-default-tracks.toml
        run: |
          set -eu

          cat >"$PV_MANIFEST_DEFAULTS" <<DEFAULT_TRACKS
          [[resource]]
          name = "postgres"
          default_track = "${{ matrix.track }}"

          DEFAULT_TRACKS

          cargo run -p pv-release -- generate-manifest \
            --records "$PV_ARTIFACT_RECORD_DIR" \
            --revocations release/artifacts/revocations \
            --defaults "$PV_MANIFEST_DEFAULTS" \
            --output "$PV_ARTIFACT_OUT_DIR/manifest.json" \
            --base-url https://artifacts.example.test

      - name: Upload artifact archives and records
        uses: actions/upload-artifact@v7
        with:
          name: pv-artifact-recipes-postgres-${{ matrix.track }}-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pv-artifacts/*.tar.gz
            ${{ runner.temp }}/pv-artifacts/manifest.json
            ${{ runner.temp }}/pv-records/**/*.json
          if-no-files-found: error

