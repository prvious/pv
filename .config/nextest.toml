[test-groups.project-hooks]
max-threads = 2

[[profile.default.overrides]]
filter = '(package(daemon) & test(/^project_hooks::/)) | test(project_link_during_daemon_prepare) | test(project_link_skip_hooks_still)'
test-group = 'project-hooks'

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 2, grace-period = "10s" }
